[storage]
engine = file_system
path = dotfiles
directory = backup

[applications_to_ignore]
ipython
ssh
# Preference domains break under mackup symlinks on modern macOS (cfprefsd).
# Hybrid apps: Preferences dropped via ~/.mackup/*.cfg overrides; App Support still synced.
# Pure Preference apps: ignored entirely; golden copies in backup/manual/prefs/.
# Scripts: scripts/prefs-export.sh, scripts/prefs-restore.sh, scripts/hotkeys-*.sh
rectangle
macosx
apple-music
terminal
hyperswitch
keymo
latexit
macvim
scroll-reverser
