palette-3 = "#df8e1d"
palette-4 = "#1e66f5"
palette-5 = "#ea76cb"
palette-6 = "#179299"
palette-7 = "#5c5f77"
palette-8 = "#acb0be"
palette-9 = "#d20f39"
palette-10 = "#40a02b"
palette-11 = "#df8e1d"
palette-12 = "#1e66f5"
palette-13 = "#ea76cb"
palette-14 = "#179299"

# font-blending = "linear" (reset to default)

palette-15 = "#6c6f85"

# selection-foreground = "#2a2422" (reset to default)
# selection-background = "#edc4be" (reset to default)
# cursor-color = "#cc8595" (reset to default)
# cursor-text = "#f5f0f0" (reset to default)

copy-on-select = true

