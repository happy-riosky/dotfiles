# Yazi 主题：跟随 tinty。启动前由 scripts/tinty-yazi-flavor 按当前 scheme
# 生成 ~/.config/yazi/flavors/tinty-{dark,light}.yazi/（运行时产物，两份
# 同内容，dark/light 双指以复刻原始结构并使明暗探测无关化），y() 包装负责
# 刷新；yazi 无 theme 热重载，切 scheme 后重新打开即可。
# 本文件仅做无色覆盖：[indicator].padding（恢复 hover 行直角，方法见
# https://github.com/sxyazi/yazi/pull/3419）与 [status].sep_left/sep_right
# （状态栏分隔符改为填满方角 █）；有色覆盖（边框等）在生成模板内用 base
# 槽位表达。upstream pin 见 flavors/*/README.md

[flavor]
dark  = "tinty-dark"
light = "tinty-light"

[indicator]
padding = { open = "█", close = "█" }

[status]
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }
