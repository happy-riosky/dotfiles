# Yazi 主题：Catppuccin lavender（dark=Frappé / light=Latte，跟随终端深浅色自动切换）
# flavor 内容来自上游官方文件，本文件仅做 [indicator].padding 覆盖（恢复 hover 行直角，
# 方法见 https://github.com/sxyazi/yazi/pull/3419）。upstream pin 见 flavors/*/README.md

[flavor]
dark  = "catppuccin-frappe-lavender"
light = "catppuccin-latte-lavender"

[indicator]
padding = { open = "█", close = "█" }
