[[mgr.prepend_keymap]]
on = "T"
run = "plugin cycle-preview"
desc = "Cycle preview pane layouts"

[[mgr.prepend_keymap]]
on = "<C-Left>"
run = "plugin resize-preview -1"
desc = "Narrow the preview pane"

[[mgr.prepend_keymap]]
on = "<C-Right>"
run = "plugin resize-preview 1"
desc = "Widen the preview pane"

[[mgr.prepend_keymap]]
for = "macos"
on = [ "c", "p" ]
run = '''shell --
f=%h
case "${f##*.}" in
  [Pp][Nn][Gg])
    osascript -e "on run argv" -e "set the clipboard to (read (POSIX file (item 1 of argv)) as «class PNGf»)" -e "end run" "$f"
    ;;
  *)
    d="$(mktemp -d)"
    t="$d/img.png"
    if sips -s format png "$f" --out "$t" >/dev/null 2>&1; then
      osascript -e "on run argv" -e "set the clipboard to (read (POSIX file (item 1 of argv)) as «class PNGf»)" -e "end run" "$t"
      s=$?
      rm -rf "$d"
      exit $s
    elif grep -qI -m1 . "$f" 2>/dev/null; then
      cat "$f" | pbcopy
      rm -rf "$d"
    else
      echo "copy-content: unsupported binary file: $f" >&2
      rm -rf "$d"
      exit 1
    fi
    ;;
esac'''
desc = "Copy file content (image as PNG, else text)"

[[mgr.prepend_keymap]]
on = [ ",", "," ]
run = "plugin toggle-mtime"
desc = "Toggle sort by modified time (reverse)"

[[mgr.prepend_keymap]]
on = "<PageUp>"
run = "seek -5"
desc = "Seek preview up 5 lines"

[[mgr.prepend_keymap]]
on = "<PageDown>"
run = "seek 5"
desc = "Seek preview down 5 lines"

# R：原地重启（y 包装函数以退出码 99 哨兵循环重新拉起，见
# scripts/shell/aliases.sh；默认键位无单键 R，R 在 rename 家族旁）
[[mgr.prepend_keymap]]
on = "R"
run = "quit --code=99"
desc = "Restart yazi (relaunched by y wrapper)"
