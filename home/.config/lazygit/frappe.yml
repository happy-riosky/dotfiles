# Catppuccin Frappe（深色）overlay：lg 函数 / nvim :LazyGit 在 tinty variant
# 为 dark（或无 tinty，对齐 Neovim 的 catppuccin-frappe 回退）时经
# LG_CONFIG_FILE 叠加到 config.yml 之上。delta 明暗由 tinty 的 git config
# 决定，无需在此配置。Values follow
# https://github.com/catppuccin/lazygit themes/frappe/yellow.yml
gui:
  theme:
    activeBorderColor:
      - '#e5c890'
      - bold
    inactiveBorderColor:
      - '#a5adce'
    searchingActiveBorderColor:
      - '#e5c890'
    optionsTextColor:
      - '#8caaee'
    selectedLineBgColor:
      - '#414559'
    inactiveViewSelectedLineBgColor:
      - '#737994'
    cherryPickedCommitFgColor:
      - '#e5c890'
    cherryPickedCommitBgColor:
      - '#51576d'
    markedBaseCommitFgColor:
      - '#8caaee'
    markedBaseCommitBgColor:
      - '#e5c890'
    unstagedChangesColor:
      - '#e78284'
    defaultFgColor:
      - '#c6d0f5'
  authorColors:
    '*': '#babbf1'
