gui:
  language: "en"
  theme:
    activeBorderColor:
      - '#df8e1d'
      - bold
    inactiveBorderColor:
      - '#6c6f85'
    searchingActiveBorderColor:
      - '#df8e1d'
    optionsTextColor:
      - '#1e66f5'
    selectedLineBgColor:
      - '#ccd0da'
    inactiveViewSelectedLineBgColor:
      - '#9ca0b0'
    cherryPickedCommitFgColor:
      - '#df8e1d'
    cherryPickedCommitBgColor:
      - '#bcc0cc'
    markedBaseCommitFgColor:
      - '#1e66f5'
    markedBaseCommitBgColor:
      - '#df8e1d'
    unstagedChangesColor:
      - '#d20f39'
    defaultFgColor:
      - '#4c4f69'

  authorColors:
    '*': '#7287fd'

# keybinding:
#   universal:
#     toggleRangeSelect: 'v'
#   commits:
#     cherryPickCopy: 'c'
#     pasteCommits: 'v'

customCommands:
  - context: 'files'
    description: 'Generate commit message with Ollama'
    prompts:
      - type: 'input'
        key: 'CommitMessage'
        title: 'AI-generated commit message (edit before committing)'
        initialValue: '{{ runCommand "/Users/riosky/.local/bin/ai-git-commit-message" }}'
    command: 'git commit --message {{.Form.CommitMessage | quote}}'
    loadingText: 'Committing...'
