notARepository: 'skip'

os:
  editPreset: 'nvim-remote'

gui:
  language: "en"
  fileTreeSortOrder: filesFirst
  showNumstatInFilesView: true
  theme:
    activeBorderColor:
      - '#df8e1d'
      - bold
    inactiveBorderColor:
      - '#6c6f85'
    searchingActiveBorderColor:
      - '#df8e1d'
    optionsTextColor:
      - '#1e66f5'
    selectedLineBgColor:
      - '#ccd0da'
    inactiveViewSelectedLineBgColor:
      - '#9ca0b0'
    cherryPickedCommitFgColor:
      - '#df8e1d'
    cherryPickedCommitBgColor:
      - '#bcc0cc'
    markedBaseCommitFgColor:
      - '#1e66f5'
    markedBaseCommitBgColor:
      - '#df8e1d'
    unstagedChangesColor:
      - '#d20f39'
    defaultFgColor:
      - '#4c4f69'

  authorColors:
    '*': '#7287fd'

git:
  diffRenderers:
    - name: delta (unified)
      command: delta --light --paging=never --line-numbers
    - name: delta (split)
      command: delta --light --paging=never --line-numbers --side-by-side

keybinding:
  universal:
    cycleDiffRenderers: '|'
    cycleDiffRenderersReverse: '<disabled>'

customCommands:
  - context: 'files'
    description: 'Generate commit message with Ollama'
    command: "msg=$(~/.local/bin/ai-git-commit-message) && git commit --edit --message \"$msg\n\n# :wq 提交 · 清空后 :wq 或 :cq 放弃\""
    output: 'terminal'
  - context: 'worktrees'
    description: 'Copy worktree path to clipboard'
    command: >-
      p="{{.SelectedWorktree.Path}}";
      if command -v pbcopy >/dev/null 2>&1; then printf "%s" "$p" | pbcopy;
      elif command -v wl-copy >/dev/null 2>&1; then printf "%s" "$p" | wl-copy;
      elif command -v xclip >/dev/null 2>&1; then printf "%s" "$p" | xclip -selection clipboard; fi
    output: none
