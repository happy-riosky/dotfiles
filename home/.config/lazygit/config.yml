notARepository: 'skip'

# 主题中立的基础配置：配色由 overlay 提供——lg 函数 / nvim :LazyGit 按
# tinty variant 经 LG_CONFIG_FILE 附加 frappe.yml(dark) / latte-theme.yml
# (light)；裸 lazygit 使用内建默认主题。见 docs/theming.md
os:
  editPreset: 'nvim-remote'

gui:
  language: "en"
  fileTreeSortOrder: filesFirst
  showNumstatInFilesView: true

git:
  paging:
    # 不带 --dark/--light，让 delta 跟随 tinty 的 git config；
    # lazygit 内建默认 pager 是 delta --dark ...，会在浅色 scheme 下强制深色
    pager: delta --paging=always
  # delta 配色同样由 tinty 决定，不在此传明暗开关
  diffRenderers:
    - name: delta (unified)
      command: delta --paging=never --line-numbers
    - name: delta (split)
      command: delta --paging=never --line-numbers --side-by-side

keybinding:
  universal:
    cycleDiffRenderers: '|'
    cycleDiffRenderersReverse: '<disabled>'

customCommands:
  - context: 'files'
    description: 'Generate commit message with Ollama'
    command: "msg=$(~/.local/bin/ai-git-commit-message) && git commit --edit --message \"$msg\n\n# :wq 提交 · 清空后 :wq 或 :cq 放弃\""
    output: 'terminal'
  - context: 'worktrees'
    description: 'Copy worktree path to clipboard'
    command: >-
      p="{{.SelectedWorktree.Path}}";
      if command -v pbcopy >/dev/null 2>&1; then printf '%s' "$p" | pbcopy;
      elif command -v wl-copy >/dev/null 2>&1; then printf '%s' "$p" | wl-copy;
      elif command -v xclip >/dev/null 2>&1; then printf '%s' "$p" | xclip -selection clipboard; fi
    output: none
