# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 0.45
    height: 0.6
    position: auto
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      labels:
        width: 22
        hidden: true
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: pgup
      builtin: pageUp
    - key: pgdown
      builtin: pageDown
  issues:
    - key: m
      name: more info
      command: >-
        gh issue view {{ .IssueNumber }} --repo {{ .RepoName }}
        --json number,title,issueType,parent,subIssues,subIssuesSummary,blockedBy,blocking
        --jq '"#\(.number) \(.title)",
        (if .issueType != null then "type: \(.issueType.name)" else empty end),
        (if .parent then "↑ parent: #\(.parent.number) \(.parent.title)" else empty end),
        (select(.subIssuesSummary.total > 0)
        | "sub-issues \(.subIssuesSummary.completed)/\(.subIssuesSummary.total) (\(.subIssuesSummary.percentCompleted | floor)%)"),
        (select(.subIssuesSummary.total > 0) | .subIssues.nodes[]
        | "  \(if .state == "CLOSED" then "✔" else "☐" end) #\(.number) \(.title)"),
        (select(.blockedBy.totalCount > 0) | .blockedBy.nodes[]
        | "⛔ blocked by #\(.number) \(.title)"),
        (select(.blocking.totalCount > 0) | .blocking.nodes[]
        | "🔨 blocks #\(.number) \(.title)"),
        (if (.parent == null) and (.subIssuesSummary.total == 0)
        and (.blockedBy.totalCount == 0) and (.blocking.totalCount == 0)
        then "(no parent / sub-issues / dependencies)" else empty end)'
        | LESS= less > /dev/tty
repoPaths: {}
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
  # Catppuccin Latte Lavender — upstream https://github.com/catppuccin/gh-dash (themes/latte/catppuccin-latte-lavender.yml)
  colors:
    text:
      primary: "#4c4f69"
      secondary: "#7287fd"
      inverted: "#dce0e8"
      faint: "#5c5f77"
      warning: "#df8e1d"
      success: "#40a02b"
      error: "#d20f39"
    background:
      selected: "#ccd0da"
    border:
      primary: "#7287fd"
      secondary: "#bcc0cc"
      faint: "#ccd0da"
pager:
  diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
