# FILE: simple_batt.tmux.conf
# MAINTAINER: Riosky <1559932694@qq.com>
# 状态栏布局与格式（电池/时间/窗口标签），不含配色。配色由 .tmux.conf
# 二选一：tinty 生成的 tinted-tmux-colors-file.conf，或本目录的
# simple_batt_fallback.tmux.conf（无 tinty 时的手工配色）。

set -g window-style ""
set -g window-active-style ""
set -g window-status-separator ""

# statusbar
set -g status-position bottom
set -g status-justify left

set -g status-left-length 10
set -g status-left ' #S |'
set -g status-left-style ""
set -g status-left-length 50

set -g @batt_icon_status_attached '\0'
set -g @batt_icon_status_charging ' ↑'
set -g @batt_icon_status_discharging ' ↓'
set -g @batt_icon_status_charged '\0'
set -g @batt_icon_status_unknown '\0'

# strftime runs over the raw status string BEFORE #{...}/#(...) expand, so
# every literal '%' (incl. inside '#(...)') must be written '%%'; a raw '%#'
# leaks the plugin path on Termux bionic (2026-08-15).
# battery_percentage self-appends '%' (WSL/apm paths are bare), so call the
# script and strip it: uniform bare number + single '%' on all platforms.
set -g status-right ' #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh | tr -d %%)%%#{battery_icon_status} | %Y-%m-%d %H:%M'
set -g status-right-length 50
# tinted-tmux 不设置 status-right-style，显式清空继承 status-style 配色，
# 否则运行中的 server 会残留回退/旧配置设置的值
set -g status-right-style ""

# active window tab
setw -g window-status-current-format ' #I #W #F '
# set -g window-status-separator '|'

# unactive window tab
setw -g window-status-format ' #I #W #F '
