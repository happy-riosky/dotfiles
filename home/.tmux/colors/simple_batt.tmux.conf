# FILE: simple_batt.tmux.conf
# MAINTAINER: Riosky <1559932694@qq.com>

# use color code like `colour123` to align to the Xtem 256 color standard
# here to check the colour code:
# https://upload.wikimedia.org/wikipedia/commons/1/15/Xterm_256color_chart.svg
# mocha mode: TMUX_SUBJECT_COLOUR="#f9e2af"
TMUX_SUBJECT_COLOUR="#da831b"
TMUX_GREY="#9399b2"
TMUX_BLACK="#1e1e2e"

set -g window-style ""
set -g window-active-style ""
set -g window-status-separator ""

# clock mode
setw -g clock-mode-colour "$TMUX_SUBJECT_COLOUR"

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=$TMUX_SUBJECT_COLOUR"

set -g status-left-length 10
set -g status-left ' #S |'
set -g status-left-style ""
set -g status-left-length 50

set -g @batt_icon_status_attached '\0'
set -g @batt_icon_status_charging ' ↑'
set -g @batt_icon_status_discharging ' ↓'
set -g @batt_icon_status_charged '\0'
set -g @batt_icon_status_unknown '\0'

# NOTE: never put a literal '%' right before #{battery_*}: on Linux, strftime
# consumes '%#' before tmux can expand '#(...)', leaking the plugin path as
# plain text into the status bar.
set -g status-right ' #{battery_percentage}#{battery_icon_status} | %Y-%m-%d %H:%M'
set -g status-right-style "fg=$TMUX_SUBJECT_COLOUR"
set -g status-right-length 50

# active window tab
set -g window-status-current-style "fg=$TMUX_SUBJECT_COLOUR"
setw -g window-status-current-format ' #I #W #F '
# set -g window-status-separator '|'

# unactive window tab
setw -g window-status-style "fg=$TMUX_GREY"
setw -g window-status-format ' #I #W #F '

# messages bar
TMUX_MESSAGES_COLOUR="#f9e2af"
set -g message-style "fg=$TMUX_BLACK bg=$TMUX_MESSAGES_COLOUR"

# pane border
set -g pane-active-border-style "fg=$TMUX_SUBJECT_COLOUR"
set -g pane-border-style "fg=$TMUX_GREY"
