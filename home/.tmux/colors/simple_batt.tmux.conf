# FILE: simple_batt.tmux.conf
# MAINTAINER: Riosky <1559932694@qq.com>
# 状态栏布局与格式（电池/时间/窗口标签），不含配色。配色由 .tmux.conf
# 二选一：tinty 生成的 tinted-tmux-colors-file.conf，或本目录的
# simple_batt_fallback.tmux.conf（无 tinty 时的手工配色）。

set -g window-style ""
set -g window-active-style ""
set -g window-status-separator ""

# statusbar
set -g status-position bottom
set -g status-justify left

set -g status-left-length 10
set -g status-left '#{?client_prefix,#[bold]#[fg=#{@tp_bg}]#[bg=#{@tp_fg}] #S #[nobold]#[fg=#{@tp_seg2_bg}]#[bg=#{@tp_fg}]◥,#[fg=#{@tp_seg1_fg}]#[bg=#{@tp_seg1_bg}] #S #[fg=#{@tp_seg2_bg}]#[bg=#{@tp_seg1_bg}]◥}#(~/.tmux/scripts/status-line.sh left #{client_width} #{pane_current_command} #{client_prefix})'
set -g status-left-style ""
set -g status-left-length 50

set -g @batt_icon_status_attached '\0'
set -g @batt_icon_status_charging ' ↑'
set -g @batt_icon_status_discharging ' ↓'
set -g @batt_icon_status_charged '\0'
set -g @batt_icon_status_unknown '\0'

# strftime runs over the raw status string BEFORE #{...}/#(...) expand, so
# any literal '%' (incl. inside '#(...)') must be written '%%'; a raw '%#'
# leaks the plugin path on Termux bionic (2026-08-15). status-right 本身已无
# '%' 字面量——电池/日期/uptime 全部在 status-line.sh 内渲染。
# status-line.sh 左右两 mode（left=cmd 常驻；right=电池>=60、uptime/日期
# >=100、时刻常驻黄锚点）；斜切块与分隔符由脚本自带，隐藏时不留悬挂
# '|'；宽度比较用 shell 数值判断（tmux 格式层的 #{>=:} 是字典序、
# #{?#{e|...}} 恒真，均不可用于宽度门控）。
set -g status-right '#(~/.tmux/scripts/status-line.sh right #{client_width})'
set -g status-right-length 60
# tinted-tmux 不设置 status-right-style，显式清空继承 status-style 配色，
# 否则运行中的 server 会残留回退/旧配置设置的值
set -g status-right-style ""

# active window tab：斜切块（前入 `` 后出 `` 向状态栏底色过渡）
setw -g window-status-current-format '#[fg=#{@tp_seg3_bg}]#[bg=#{@tp_bg}]◥#[fg=#{@tp_seg3_fg}]#[bg=#{@tp_seg3_bg}] #I:#W#F #[fg=#{@tp_seg3_bg}]#[bg=#{@tp_bg}]◣'
# set -g window-status-separator '|'

# unactive window tab：最浅档
setw -g window-status-format '#[fg=#{@tp_seg4_bg}]#[bg=#{@tp_bg}]◥#[fg=#{@tp_seg4_fg}]#[bg=#{@tp_seg4_bg}] #I:#W#F #[fg=#{@tp_seg4_bg}]#[bg=#{@tp_bg}]◣'
