# FILE: simple_batt_fallback.tmux.conf
# MAINTAINER: Riosky <1559932694@qq.com>
# 无 tinty（server/Termux/首次 tinty apply 前）时的状态栏配色，
# 由 .tmux.conf 经 if-shell 在 tinty 主题文件缺失时加载。
# use color code like `colour123` to align to the Xtem 256 color standard
# here to check the colour code:
# https://upload.wikimedia.org/wikipedia/commons/1/15/Xterm_256color_chart.svg
# frappe fallback：中性面取 catppuccin-frappe，黄 identity 各处保留（与
# opencode/lazygit/vim 的无 tinty 兜底同款规则，见 docs/theming.md）
TMUX_SUBJECT_COLOUR="#da831b"
TMUX_GREY="#949cbb"
TMUX_BLACK="#303446"

# clock mode
setw -g clock-mode-colour "$TMUX_SUBJECT_COLOUR"

# statusbar
set -g status-style "fg=$TMUX_SUBJECT_COLOUR"
set -g status-right-style "fg=$TMUX_SUBJECT_COLOUR"

# active window tab
set -g window-status-current-style "fg=$TMUX_SUBJECT_COLOUR"

# unactive window tab
setw -g window-status-style "fg=$TMUX_GREY"

# messages bar
TMUX_MESSAGES_COLOUR="#f9e2af"
set -g message-style "fg=$TMUX_BLACK bg=$TMUX_MESSAGES_COLOUR"

# pane border
set -g pane-active-border-style "fg=$TMUX_SUBJECT_COLOUR"
set -g pane-border-style "fg=$TMUX_GREY"
