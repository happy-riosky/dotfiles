#-------------------------------------------------------------------------------
# General
#-------------------------------------------------------------------------------
# Avoid ESC delay
set -s escape-time 50

# set scroll history to 100,000 lines
set -g history-limit 100000
set -g history-file ~/.tmux_history

# Fix titlebar
set -g set-titles on
set -g set-titles-string "#T"

# Mouse friendly
set -g mouse on

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#-------------------------------------------------------------------------------
# Terminal & input
#-------------------------------------------------------------------------------
# modern colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
# Nested-session clients (popups, SSH-nested tmux) attach with
# TERM=tmux-256color, whose stock terminfo lacks Ms -- without the clipboard
# feature, inner-session copies (prefix+[ v/y) never emit OSC 52, so they
# cannot reach the system clipboard; the outer tmux forwards app OSC 52 to
# the real terminal per set-clipboard (default external).
set -as terminal-features ",tmux-256color:clipboard"

# pi: forward modified keys (Shift/Ctrl+Enter) to terminal apps
set -g extended-keys on
set -g extended-keys-format csi-u
# pi: parse CSI-u sequences from Windows Terminal (xterm-256color) too
set -as terminal-features ",xterm-256color:extkeys"

# Allow OSC 52 clipboard sequences from terminal applications such as OpenCode.
set -g allow-passthrough on

#-------------------------------------------------------------------------------
# Prefix & misc bindings
#-------------------------------------------------------------------------------
# unbind the prefix and bind it to Ctrl-a like screen
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# use prefix + m to mark a pane and prefix + g to go to it
bind g switch-client -t'{marked}'

#-------------------------------------------------------------------------------
# Panes & windows
#-------------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind c clock-mode

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 无前缀切窗口（与 prefix n/p 语义一致；依赖 kitty macos_option_as_alt left）
bind -n C-M-n next-window
bind -n C-M-p previous-window

#-------------------------------------------------------------------------------
# Copy mode (vi)
#-------------------------------------------------------------------------------
# VIM mode
set -g mode-keys vi

# set things up so that v starts a selection and y finishes it in the same way that Space and Enter do, more like Vim:
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection

# v/y 复制必须进系统剪贴板。tmux 自身的 OSC 52 只发给最外层客户端——嵌套
# 弹窗（内层会话）发出的 OSC 52 会被外层 tmux 丢弃（3.5a 实测 external/on
# 均不转发；只有 DCS passthrough 例外），故按平台把选区 pipe 给剪贴板工具
# （copy-pipe 同时仍写 tmux buffer，prefix+] 不受影响）。if-shell 在配置
# 加载期于 server 上探测，server 即剪贴板所在机器；后写的优先级高：
# X11 < Wayland < Termux < macOS（darwin 上 Homebrew xclip 存在但无 X，
# 必须被 pbcopy 覆盖；Linux 按会话环境守卫，headless SSH 保持 OSC 52 原生路径）。
if-shell 'command -v xclip >/dev/null 2>&1 && test -n "$DISPLAY"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
if-shell 'command -v wl-copy >/dev/null 2>&1 && test -n "$WAYLAND_DISPLAY"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel wl-copy; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel wl-copy'
if-shell 'command -v termux-clipboard-set >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel termux-clipboard-set; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel termux-clipboard-set'
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy'

# Match ~/.vimrc: J/K move ten display rows in copy mode.
bind-key -T copy-mode-vi J send-keys -X -N 10 cursor-down
bind-key -T copy-mode-vi K send-keys -X -N 10 cursor-up

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

#-------------------------------------------------------------------------------
# Smart pane navigation (work with vim & fzf)
#-------------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | \
  grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | \
  grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                          tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
                         ($is_fzf && tmux send-keys C-j) || \
                         tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                         ($is_fzf && tmux send-keys C-k)  || \
                         tmux select-pane -U"
# C-l 同款守卫：vim 内转发（重绘/清搜索高亮），其余在 pane 间轮番切换
bind -n C-l run "($is_vim && tmux send-keys C-l) || \
                         tmux select-pane -t :.+"

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

#-------------------------------------------------------------------------------
# Status bar & theming
#-------------------------------------------------------------------------------
source-file ~/.tmux/colors/simple_batt.tmux.conf

# 状态栏配色：先无条件 source fallback 手工配色打底——消灭 tmux 内建
# 绿色状态栏的启动一闪，也覆盖 server/Termux/首次 apply 前的场景；tinty
# 生成的主题文件（运行时产物）存在则覆盖之。tinted-tmux 模板不设置
# status-right-style，覆盖后须显式清空以继承 status-style 配色
# （simple_batt 布局同款注意事项）；tinty apply 的 hook 仍会热加载。
source-file ~/.tmux/colors/simple_batt_fallback.tmux.conf
if-shell '[ -f "$HOME/.local/share/tinted-theming/tinty/tinted-tmux-colors-file.conf" ]' \
  'source-file -q ~/.local/share/tinted-theming/tinty/tinted-tmux-colors-file.conf; set -g status-right-style ""'

# tmux 状态栏黄色阶（@tp_*）：tinty hook 渲染 <data>/tmux-status-colors.conf
# （apply/init 热加载），缺失时上面 fallback 的 frappe 常量继续打底。
# simple_batt 布局与 status-line.sh 均引用 @tp_*。
if-shell '[ -f "$HOME/.local/share/tinted-theming/tinty/tmux-status-colors.conf" ]' \
  'source-file -q ~/.local/share/tinted-theming/tinty/tmux-status-colors.conf'

#-------------------------------------------------------------------------------
# Display popups
#-------------------------------------------------------------------------------
# 内容型弹窗（ipython/rmpc/yazi/chat/lazygit/zsh）一律经嵌套会话启动：
# popup 不是 pane——无 scrollback、无 copy-mode、不可拖选（上游限制，
# tmux/tmux#2832）；嵌套后即真实 pane，全 server 选项（history-limit、
# mode-keys、mouse）直接生效：滚轮翻页、prefix+[ v/y 选择复制、弹窗内
# 再开弹窗均可。status off 去掉内层状态栏；destroy-unattached 封堵弹窗内
# prefix+d 泄漏的游离会话；应用退出 → 会话随之消亡（exit-empty）。
# 会话选择类（C-n/C-j/T）保持直跑：switch-client 必须作用于外层客户端。
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
# prefix+C-j 会话选择弹窗：fzf 配色继承 server 全局 FZF_DEFAULT_OPTS
# （tinty tmux hook 每次 apply 刷新，同 prefix+T）；单引号包裹让 $(…) 留待
# 弹窗弹出时求值（“排除当前会话”不冻结在配置加载期）。
bind C-j display-popup \
  -E 'sel="$(tmux list-sessions -F "#S" | grep -v "^$(tmux display-message -p "#S")$" | fzf --reverse)"; [ -n "$sel" ] && tmux switch-client -t "$sel"'
# prefix+T 主题选择弹窗：非交互 shell 无 theme alias，内联等价实现；fzf
# 配色继承 server 全局 FZF_DEFAULT_OPTS（tinty tmux hook 每次 apply 刷新）。
bind T display-popup \
  -E 'command -v tinty >/dev/null 2>&1 || exit 0; sel="$(tinty list | fzf)"; [ -n "$sel" ] && tinty apply "$sel"'
bind C-p display-popup -E 'tmux new-session ipython \; set status off \; set destroy-unattached on'
bind C-f display-popup \
  -w 80% \
  -h 80% \
  -E 'tmux new-session rmpc \; set status off \; set destroy-unattached on'
# yazi 嵌套会话的起源：popup 的 pty 后端不转发终端探测（tmux popup 不支持
# passthrough，tmux/tmux#4329；yazi 探测超时 ~5s 卡启动/退出，yazi#2308）。
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E 'tmux new-session yazi \; set status off \; set destroy-unattached on'
bind C-g display-popup \
  -E 'tmux new-session "bash -i ~/.tmux/scripts/chat-popup.sh" \; set status off \; set destroy-unattached on'
bind C-l display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E 'tmux new-session lazygit \; set status off \; set destroy-unattached on'
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E 'tmux new-session zsh \; set status off \; set destroy-unattached on'

#-------------------------------------------------------------------------------
# Plugins & server environment
#-------------------------------------------------------------------------------
# Plugins loaded via run-shell inherit the tmux SERVER's PATH, captured when
# the server started -- it may lack ~/.local/bin.
# Prepend user-local bins to the global environment before TPM runs, so
# plugin detection and reloads (source-file) both see them. Guard keeps it
# idempotent -- source-file runs this on every reload and would otherwise
# duplicate the prefix on the server PATH each time.
run 'case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) tmux set-environment -g PATH "$HOME/.local/bin:$HOME/bin:$PATH" ;; esac'

# refresh EDITOR/VISUAL from the attaching client's environment on every attach,
# so panes never inherit a stale editor captured when the server started.
# TERM/TERM_PROGRAM are also refreshed: yazi requires both to detect the real
# terminal behind tmux (https://yazi-rs.github.io/docs/image-preview).
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY EDITOR VISUAL TERM TERM_PROGRAM"

## tpm: Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'Morantron/tmux-fingers'

# tmux-fingers: prefix+F 高亮 hint；裸按 hint 直接用默认浏览器打开，Ctrl+hint 复制
# prefix+u 为只匹配 URL 的 fingers 模式（原 tmux-urlview 键位）
set -g @fingers-main-action ':open:'
set -g @fingers-ctrl-action ':copy:'
set -g @fingers-highlight-style 'underscore,bold,fg=yellow'
bind u run -b "#{@fingers-cli} start #{pane_id} --patterns url"

# Initialize TMUX plugin manager (keep this line at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
